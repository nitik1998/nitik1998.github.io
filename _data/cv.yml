    Projects:
      - name: PAVE — Probing Affordance in Vision-Language-Action Encoders
        summary: Do robot-policy (VLA) models keep the affordance signal of their foundation vision encoders? (JHU graduate research, 2026)
        start_date: 2026
        highlights:
          - A frozen DINOv2-large linear probe reaches 0.776 mIoU on UMD Part-Affordance — +10.6 pp over a CVPR'26 dense decoder, with no decoder, fine-tuning, or augmentation
          - Showed end-to-end VLA fine-tuning (π0, π0.5, OpenVLA) degrades affordances class-asymmetrically (cut −27 pp vs. contain −1 pp), generalizing across two VLA families
          - A 297K-param MLP adapter recovers cut IoU 0.181→0.405 (82% of the gap); per-class feature drift predicts the loss (ρ = 0.90)

      - name: GENIE — Latent Structure with Diffusion Models
        summary: Generative modeling of quark/gluon-jet calorimeter images (GSoC 2026 evaluation, ML4SCI)
        start_date: 2026
